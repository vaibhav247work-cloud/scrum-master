spring:
  application:
    name: company-os-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/company_os?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:company_os}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never

security:
  headers:
    content-security-policy: ${SECURITY_CONTENT_SECURITY_POLICY:default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'}
  session:
    # Local development uses HTTP. Production deployments must set
    # SESSION_COOKIE_SECURE=true when served over HTTPS.
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  rate-limit:
    enabled: ${SECURITY_RATE_LIMIT_ENABLED:true}
    login:
      ip-limit: ${SECURITY_RATE_LIMIT_LOGIN_IP_LIMIT:30}
      identity-limit: ${SECURITY_RATE_LIMIT_LOGIN_IDENTITY_LIMIT:10}
      window: ${SECURITY_RATE_LIMIT_LOGIN_WINDOW:PT15M}
    onboarding:
      ip-limit: ${SECURITY_RATE_LIMIT_ONBOARDING_IP_LIMIT:5}
      window: ${SECURITY_RATE_LIMIT_ONBOARDING_WINDOW:PT1H}
    activation:
      ip-limit: ${SECURITY_RATE_LIMIT_ACTIVATION_IP_LIMIT:10}
      window: ${SECURITY_RATE_LIMIT_ACTIVATION_WINDOW:PT1H}
    webhook:
      ip-limit: ${SECURITY_RATE_LIMIT_WEBHOOK_IP_LIMIT:120}
      window: ${SECURITY_RATE_LIMIT_WEBHOOK_WINDOW:PT1M}
  invitation:
    expose-token: ${EXPOSE_INVITATION_TOKEN:false}

notification:
  secret-key: ${NOTIFICATION_SECRET_KEY:}

idempotency:
  processing-ttl: ${IDEMPOTENCY_PROCESSING_TTL:PT10M}
  completed-ttl: ${IDEMPOTENCY_COMPLETED_TTL:PT24H}

cache:
  feature-entitlements-ttl: ${CACHE_FEATURE_ENTITLEMENTS_TTL:PT5M}

outbox:
  notification:
    enabled: ${OUTBOX_NOTIFICATION_ENABLED:true}
    poll-ms: ${OUTBOX_NOTIFICATION_POLL_MS:5000}
    metrics-poll-ms: ${OUTBOX_NOTIFICATION_METRICS_POLL_MS:30000}
    metrics-initial-delay-ms: ${OUTBOX_NOTIFICATION_METRICS_INITIAL_DELAY_MS:10000}
